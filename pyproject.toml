[project]
name = "vibecheck-whyd"
version = "0.2.0"
description = "AI로 짠 코드, 설명할 수 있게 — 내 레포로 면접 예상질문을 받고, 내 답을 코드 근거로 채점한다"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["code-understanding", "interview-practice", "rag", "tree-sitter", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-java",
    "anthropic",
    "python-dotenv",
    "typer",
    "rich",
    # 서버를 켠 채 다시 인덱싱해도 새 인덱스를 보게 하는 동작(store.vector.get_client)을
    # 1.5.9에서 확인했다. 연결을 close()로 내리고 새로 여는 방식에 기댄다.
    "chromadb>=1.5",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    # MCP 서버(whyd mcp). 2.x에서 FastMCP가 MCPServer로 바뀌는 등 큰 버전마다
    # 사용법이 통째로 바뀌어, 다음 큰 버전에서 조용히 깨지지 않게 위를 막는다.
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/ahrdyrxkddhfl/vibecheck"
Issues = "https://github.com/ahrdyrxkddhfl/vibecheck/issues"

# whyd가 명령 이름이다. PyPI의 whyd라는 이름은 다른 도구가 쓰고 있어, 배포 이름과
# 같은 별칭을 하나 더 둔다. uvx vibecheck-whyd처럼 설치 없이 바로 실행할 수 있다.
[project.scripts]
whyd = "vibecheck.cli:main"
vibecheck-whyd = "vibecheck.cli:main"

[tool.setuptools.packages.find]
include = ["vibecheck*"]

# 파이썬 파일이 아닌 것은 따로 적어야 패키지에 들어간다. 적지 않으면 편집 모드
# (pip install -e .)에서는 레포를 직접 읽어 티가 나지 않다가, pip install .이나
# PyPI로 설치하면 프롬프트와 웹 화면이 빠져 모든 LLM 호출과 whyd serve가 깨진다.
[tool.setuptools.package-data]
"vibecheck.prompts" = ["*.txt"]
"vibecheck.web" = ["static/*.html"]

[build-system]
# license = "MIT"처럼 라이선스를 이름(SPDX)으로 적는 방식은 setuptools 77부터 받는다.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"