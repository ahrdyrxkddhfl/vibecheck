<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCheck</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1c1a17;
    --muted: #6b6560;
    --faint: #9a938c;
    --line: #e2ddd6;
    --accent: #8a5a2b;
    --warn: #a8500f;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.5rem;
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; letter-spacing: -0.01em; }
  h2 {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 2.5rem 0 0.75rem; font-weight: 600;
  }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input {
    flex: 1; padding: 0.6rem 0.75rem; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0.6rem 1.1rem; font: inherit; font-weight: 500;
    border: 0; border-radius: 6px; background: var(--fg); color: var(--bg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #msg { color: var(--warn); min-height: 1.5rem; font-size: 0.9rem; }

  .stats { display: flex; gap: 2.5rem; flex-wrap: wrap; }
  .stat b { display: block; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
  .stat span { font-size: 0.8rem; color: var(--muted); }

  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tag {
    padding: 0.2rem 0.55rem; border: 1px solid var(--line);
    border-radius: 4px; background: #fff;
    font-family: var(--mono); font-size: 0.82rem;
  }

  .entry { padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
/* 접힌 목록은 모듈 지도의 details와 생김새를 맞춘다.
같은 동작인데 다르게 보이면 클릭할 수 있다는 걸 알아채기 어렵다. */
  #entries details summary {
    padding: 0.5rem 0; font-size: 0.85rem; color: var(--muted);
  }
  #entries details { border-bottom: 0; }
  .mark {
    display: inline-block; min-width: 3.2rem; font-size: 0.75rem;
    font-weight: 600; color: var(--muted);
  }
  .mark.on { color: var(--accent); }
  code { font-family: var(--mono); font-size: 0.88rem; }

  /* 폴더는 파일과 다른 축이므로 색과 모양을 갈라야 계층이 읽힌다.
     같은 회색 계열로 두었더니 목록 안에 묻혀 구분이 안 됐다. */
  .dir {
    display: inline-block;
    margin: 1.75rem 0 0.4rem;
    padding: 0.15rem 0.55rem 0.15rem 0.45rem;
    background: #efe9e0; color: var(--accent);
    border-radius: 4px;
    font-family: var(--mono); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .dir::before { content: "📁 "; }
  .dir:first-child { margin-top: 0; }

  details { border-bottom: 1px solid var(--line); }
  details summary {
    padding: 0.45rem 0; cursor: pointer; list-style: none;
    display: flex; gap: 0.6rem; align-items: baseline;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before {
    content: "▸"; color: var(--faint); font-size: 0.7rem; flex: none;
  }
  details[open] summary::before { content: "▾"; }
  .fname { font-family: var(--mono); font-size: 0.86rem; flex: none; }
  /* 한 줄 요약은 넘치면 자른다. 줄바꿈되면 파일 목록의 리듬이 깨진다. */
  .fnote {
    color: var(--faint); font-size: 0.8rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  details pre {
    margin: 0 0 0.75rem 1.3rem; padding: 0.75rem; background: #fff;
    border: 1px solid var(--line); border-radius: 6px;
    font-size: 0.82rem; white-space: pre-wrap; color: var(--muted);
  }

  /* 탭은 목록이 아니라 현재 위치를 알리는 장치다. 선택된 것만 진하게 두고
     나머지는 배경에 가깝게 눕혀야 지금 어디를 보고 있는지 한눈에 읽힌다. */
  .tabs {
    display: flex; gap: 0.25rem;
    border-bottom: 1px solid var(--line); margin-bottom: 0.5rem;
  }
  .tab {
    padding: 0.5rem 0.9rem; font: inherit; font-size: 0.88rem;
    background: none; color: var(--muted); border: 0;
    border-bottom: 2px solid transparent; border-radius: 0;
    cursor: pointer; margin-bottom: -1px;
  }
  .tab:hover { color: var(--fg); }
  .tab.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }

  .qguide {
    margin: 1.5rem 0 0; padding: 0.6rem 0.8rem;
    background: #f3efe8; border-radius: 6px;
    font-size: 0.85rem; color: var(--muted);
  }

  .stage { margin: 2rem 0 0.75rem; }
  .qbox { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
  .qbox:last-child { border-bottom: 0; }
  .qhead { display: flex; gap: 0.6rem; align-items: baseline; }
  .qno {
    font-family: var(--mono); font-size: 0.8rem; color: var(--faint);
    flex: none; min-width: 1.8rem;
  }
  .qtext { font-size: 0.98rem; font-weight: 500; }

  /* 코드로 답할 수 있는지 여부가 이 화면에서 가장 중요한 구분이다.
     같은 회색으로 두면 "단정하면 위험한 것"을 그냥 참고 사항으로 읽는다. */
  .qflag { font-size: 0.78rem; margin: 0.5rem 0 0 2.4rem; }
  .qflag.safe { color: var(--muted); }
  .qflag.warn { color: var(--warn); font-weight: 600; }

  .qlist { margin: 0.5rem 0 0 2.4rem; font-size: 0.85rem; }
  .qlist dt {
    font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint); margin-top: 0.6rem;
  }
  .qlist dd { margin: 0.2rem 0 0 0; color: var(--muted); }
  .qlist dd::before { content: "· "; color: var(--faint); }

  /* 터미널로 넘어가는 출구다. 웹에 Q&A 화면이 생기면 버튼으로 바뀔 자리라
     지금은 복사만 되면 충분하다. */
  .qask {
    margin: 0.75rem 0 0 2.4rem; padding: 0.4rem 0.6rem;
    background: #fff; border: 1px solid var(--line); border-radius: 5px;
    font-family: var(--mono); font-size: 0.78rem; color: var(--muted);
    white-space: pre-wrap; word-break: break-all;
  }
  
    /* 답변 입력은 질문에 딸린 것이므로 왼쪽 여백을 목록과 맞춘다.
     질문 카드 밖으로 나가면 어느 질문에 답하는 중인지 흐려진다. */
  .answer { margin: 0.9rem 0 0 2.4rem; }
  .answer textarea {
    display: block; width: 100%; min-height: 7rem; padding: 0.7rem 0.8rem;
    font: inherit; font-size: 0.88rem; line-height: 1.6;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    resize: vertical;
  }
  .answer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .answer .row {
    display: flex; gap: 0.6rem; align-items: center; margin-top: 0.5rem;
  }
  .answer button { padding: 0.45rem 0.9rem; font-size: 0.85rem; }
  .answer .note { font-size: 0.78rem; color: var(--faint); }

  .score { margin: 1rem 0 0 2.4rem; }
  .score .nums {
    display: flex; gap: 1.5rem; align-items: baseline; flex-wrap: wrap;
    padding-bottom: 0.6rem; border-bottom: 1px solid var(--line);
  }
  .score .axis { font-size: 0.8rem; color: var(--muted); }
  .score .axis b { font-weight: 600; color: var(--fg); }
  .score .sum { font-size: 1.1rem; font-weight: 600; }

  /* 근거 없이 단정한 지점을 점수보다 먼저, 눈에 띄게 둔다.
     주장 목록 안에 섞어두면 지나친다. 면접에서 무너지는 곳이 정확히 거기다. */
  .score .alarm {
    margin-top: 0.7rem; padding: 0.5rem 0.7rem;
    background: #fbeee4; border-radius: 5px;
    font-size: 0.85rem; color: var(--warn); font-weight: 600;
  }

  .claim { padding: 0.5rem 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  .claim:last-child { border-bottom: 0; }
  .claim .tagline { display: flex; gap: 0.5rem; align-items: baseline; }
  .verdict {
    flex: none; min-width: 5.5rem; font-size: 0.75rem; font-weight: 600;
  }
  .verdict.ok { color: #2f6b3a; }
  .verdict.bad { color: #a02020; }
  .verdict.unk { color: var(--warn); }
  .claim .why { margin: 0.2rem 0 0 6rem; color: var(--faint); font-size: 0.8rem; }
  .score .line { margin-top: 0.8rem; font-size: 0.88rem; font-weight: 500; }
  .score .fix { margin-top: 0.3rem; font-size: 0.85rem; color: var(--muted); }

  .graph { margin-top: 1.5rem; text-align: center; }
  .graph svg { max-width: 100%; height: auto; }
  .graph .empty { color: var(--muted); font-size: 0.9rem; }

  .meta { font-size: 0.82rem; color: var(--muted); margin-top: 2.5rem; }
  [hidden] { display: none !important; }

  .rel { margin: 8px 0 4px; font-size: 13px; }
  .rel-head { color: var(--muted); margin: 8px 0 4px; }
  .rel-row { display: flex; gap: 8px; padding: 2px 0 2px 12px; }
  .rel-dir { color: var(--muted); flex: 0 0 88px; font-family: ui-monospace, monospace; }
  .rel-names { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .rel-name { font-family: ui-monospace, monospace; }
</style>
<script type="module">
  // 관계도는 노드와 화살표를 직접 배치해야 하는데, 그 계산이 코드의
  // 대부분을 차지한다. Mermaid는 텍스트만 넘기면 배치까지 맡아준다.
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  window.mermaid = mermaid;
</script>
</head>
<body>
<main>
  <h1>VibeCheck</h1>

  <form id="form">
    <input id="path" placeholder="~/work/my-repo" autocomplete="off" required>
    <button id="go">분석</button>
  </form>
  <div id="msg"></div>

  <div id="result" hidden>
    <div class="tabs">
      <button class="tab on" data-panel="overview">개요</button>
      <button class="tab" data-panel="interview">면접 질문</button>
      <button class="tab" data-panel="graph">관계도</button>
    </div>

    <div id="panel-overview">
      <h2>규모</h2>
      <div class="stats" id="stats"></div>

      <h2>외부 의존성</h2>
      <div class="tags" id="deps"></div>

      <h2>진입점</h2>
      <div id="entries"></div>

      <h2>모듈 지도</h2>
      <div id="files"></div>
    </div>

    <div id="panel-interview" hidden>
      <div id="questions"></div>
    </div>
    <div id="panel-graph" hidden>
      <div id="graph"></div>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// 탭은 데이터를 다시 받지 않는다. 제출할 때 두 API를 한꺼번에 받아두므로
// 두 화면이 항상 같은 시점의 스냅샷을 보여준다. 탭마다 따로 받으면
// 그 사이 인덱스가 바뀌었을 때 숫자가 어긋난다.
for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    for (const other of document.querySelectorAll(".tab")) {
      other.classList.toggle("on", other === tab);
    }
    $("panel-overview").hidden = tab.dataset.panel !== "overview";
    $("panel-interview").hidden = tab.dataset.panel !== "interview";
    $("panel-graph").hidden = tab.dataset.panel !== "graph";
  });
}


/**
 * 응답에서 몸통을 꺼낸다. 실패면 읽을 수 있는 오류를 던진다.
 *
 * .json()을 먼저 부르면 안 된다. 예상하지 못한 500에서는 서버가
 * JSON이 아니라 HTML 오류 화면을 보내므로 파싱이 먼저 터지고,
 * 준비해둔 안내 대신 "Unexpected token" 같은 문구가 화면에 뜬다.
 * 실제로 그렇게 떴다.
 *
 * 상태를 먼저 보고, 몸통은 읽어보되 실패해도 넘어간다.
 * deps가 만드는 400·404·409는 detail이 있는 JSON이라 그대로 쓰고,
 * 그렇지 않으면 상태 번호만이라도 알려준다.
 *
 * @param {Response} res - fetch 응답.
 * @returns {Promise<object>} 파싱된 몸통.
 */
async function body(res) {
  let data = null;
  try {
    data = await res.json();
  } catch {
    // JSON이 아닌 응답이다. 아래에서 상태 번호로 안내한다.
  }

  if (!res.ok) {
    throw new Error((data && data.detail) || "요청 실패 (" + res.status + ")");
  }

  if (data === null) {
    throw new Error("응답을 읽지 못했습니다 (" + res.status + ")");
  }

  return data;
}

/**
 * 경로 하나로 두 API를 받아 세 화면을 채운다.
 *
 * 제출과 새로고침 복원이 같은 일을 하므로 함수로 뺀다.
 * 두 곳이 따로 자라면 한쪽만 고치는 일이 생긴다.
 *
 * @param {string} path - 대상 레포 경로.
 */
async function analyze(path) {
  $("go").disabled = true;
  $("msg").textContent = "분석하는 중...";
  $("result").hidden = true;

  try {
    const query = "?path=" + encodeURIComponent(path);
    const [overviewRes, interviewRes] = await Promise.all([
      fetch("/api/overview" + query),
      fetch("/api/interview" + query),
    ]);

    const overview = await body(overviewRes);
    const interview = await body(interviewRes);

    render(overview);
    renderInterview(interview, path);
    renderGraph(overview);
    $("msg").textContent = "";
  } catch (err) {
    $("msg").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const path = $("path").value.trim();
  if (!path) return;

  // 주소에 남겨야 새로고침해도 보던 레포가 유지된다.
  // 값을 화면에만 두면 새로고침 한 번에 빈 화면으로 돌아간다.
  // localStorage가 아니라 주소를 쓰는 이유는 API가 이미 ?path=를
  // 쓰고 있고, 주소를 그대로 넘겨주면 같은 화면이 열리기 때문이다.
  history.replaceState(null, "", "?path=" + encodeURIComponent(path));
  analyze(path);
});

// 주소에 경로가 있으면 열자마자 복원한다.
//
// load에서 하는 이유는 관계도가 CDN에서 받아오는 mermaid를 쓰기
// 때문이다. 스크립트가 파싱되는 시점에 부르면 mermaid가 아직
// 도착하지 않아 관계도만 "그리지 못했습니다"로 뜬다.
// load는 모듈 스크립트를 기다린다.
//
// 두 API 모두 LLM을 부르지 않으므로 다시 받는 데 요금이 들지 않는다.
window.addEventListener("load", () => {
  const saved = new URLSearchParams(location.search).get("path");
  if (!saved) return;

  $("path").value = saved;
  analyze(saved);
});

/**
 * 파일 개요에서 사람이 읽을 한 줄을 뽑는다.
 *
 * 모듈 독스트링이 있으면 그 첫 줄을 쓴다. 작성자가 파일 전체를 두고 쓴
 * 문장이라 무엇을 하는 파일인지 가장 정확하게 알려준다.
 *
 * 없으면 첫 심볼의 요약으로 대신한다. 파일 전체를 대표하지는 못하지만
 * 아무것도 없는 것보다는 낫다. 이 경우 심볼 이름을 함께 남겨
 * 파일 설명이 아니라 그 심볼의 설명임이 드러나게 한다.
 *
 * 첫 줄에서 독스트링 자리만 꺼낸다. 나머지 조각은 임베딩용 키워드
 * 나열이라 사람이 읽을 문장이 아니다.
 */
function oneLine(path, overview) {
  const lines = (overview || "").split("\n");

  // 첫 줄은 " / "로 이어붙인 조각들이고, 두 번째 자리가 모듈 독스트링의
  // 첫 문장이다. 조립된 조각은 전부 "라벨: 값" 꼴이므로 콜론이 없으면
  // 사람이 쓴 문장이라고 본다. 독스트링이 없으면 그 자리에
  // "사용 라이브러리: ..."가 와서 콜론으로 걸러진다.
  const head = (lines[0] || "").split(" / ");
  if (head[1] && !head[1].includes(":")) {
    return head[1].trim();
  }

  const at = lines.findIndex((l) => l.startsWith("  심볼별 요약:"));
  if (at !== -1 && lines[at + 1]) {
    // "    execute: 설명" 에서 심볼 이름과 설명을 나눈다.
    const first = lines[at + 1].trim();
    const cut = first.indexOf(": ");
    if (cut === -1) return first;

    // 독스트링이 없어 심볼 설명을 빌려 쓰는 경우다.
    // 이름을 붙여두지 않으면 파일 전체 설명으로 오해한다.
    return first.slice(0, cut) + "() — " + first.slice(cut + 2);
  }

  if ((overview || "").includes("정의된 함수·클래스 없음")) {
    return "정의 없음 (재수출·설정 파일)";
  }
  return "";
}

/**
 * 펼쳤을 때 보여줄 본문을 정리한다.
 *
 * 첫 줄(summary)은 임베딩용 키워드를 " / "로 이어붙인 것이라 그대로 두면
 * 읽기 어렵다. 그렇다고 통째로 버리면 사용 라이브러리가 사라지는데,
 * 그 정보는 화면 어디에도 없다. 상단 "외부 의존성"은 레포 전체 목록이라
 * "이 파일이 무엇에 기대는가"에는 답하지 못한다.
 *
 * 파일 경로와 정의 목록은 버린다. 경로는 바로 위 파일명과 중복이고,
 * 정의 목록은 아래 심볼별 요약에 설명과 함께 다시 나온다.
 */
function detailBody(overview) {
  const lines = (overview || "").split("\n");
  const head = lines[0] || "";

  const out = [];

  const libs = head.match(/사용 라이브러리: ([^/]+)/);
  if (libs) out.push("라이브러리: " + libs[1].trim(), "");

  const at = lines.findIndex((l) => l.startsWith("  심볼별 요약:"));
  if (at !== -1) {
    // 앞의 네 칸 들여쓰기를 없애 왼쪽 정렬을 맞춘다.
    out.push(...lines.slice(at + 1).map((l) => l.replace(/^ {4}/, "")));
  }

  return out.join("\n").trim();
}

/** 경로를 디렉터리별로 묶는다. 루트 파일은 맨 앞에 온다. */
function groupByDir(files) {
  const groups = new Map();
  for (const f of files) {
    const cut = f.path.lastIndexOf("/");
    const dir = cut === -1 ? "" : f.path.slice(0, cut);
    const name = cut === -1 ? f.path : f.path.slice(cut + 1);
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push({ ...f, name });
  }
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

/**
 * 파일 하나에 붙은 관계를 폴더별로 묶어 보여준다.
 *
 * 폴더 단위 관계도는 화살표에 "6"이라고만 적혀 어느 파일이 어느 파일을
 * 가리키는 6인지 알 수 없었다. 파일 단위로 전부 그리면 30개 파일에
 * 66개 화살표가 얽혀 더 못 읽는다. 한 파일만 두고 양쪽을 세우면
 * 가장 많은 것이 12개라 목록으로 읽힌다.
 *
 * 폴더로 묶는 이유는 열두 줄이 평평하게 나열되면 어느 계층과 얽혀
 * 있는지가 안 보이기 때문이다. core와 services와 store가 각각
 * 몇 개인지가 그 파일의 자리를 말해준다.
 *
 * 그림 대신 목록인 이유는 열 개 남짓한 화살표를 그려도 배치가 제멋대로라
 * 읽는 데 도움이 되지 않기 때문이다. 방향은 글자로 적으면 헷갈리지 않는다.
 *
 * @param {string} path - 대상 파일 경로.
 * @param {Array<{from: string, to: string}>} edges - 파일 간 참조 전체.
 * @returns {HTMLElement|null} 관계 목록. 양쪽 다 없으면 null.
 */
function relations(path, edges) {
  const uses = [];
  const usedBy = [];

  for (const e of edges || []) {
    if (e.from === path) uses.push(e.to);
    if (e.to === path) usedBy.push(e.from);
  }

  if (!uses.length && !usedBy.length) return null;

  const wrap = el("div", "rel");

  const section = (label, items) => {
    if (!items.length) return;

    wrap.append(el("div", "rel-head", label + " (" + items.length + ")"));

    for (const [dir, names] of groupByDir(items.map((p) => ({ path: p })))) {
      const row = el("div", "rel-row");
      row.append(el("span", "rel-dir", dir ? dir + "/" : "/"));

      const list = el("span", "rel-names");
      for (const f of names.sort((a, b) => a.name.localeCompare(b.name))) {
        list.append(el("span", "rel-name", f.name));
      }

      row.append(list);
      wrap.append(row);
    }
  };

  section("← 이 파일은 어디서 쓰이나?", usedBy);
  section("→ 이 파일은 무엇을 필요로 하나?", uses);

  return wrap;
}

function render(d) {
  document.title = d.name + " — VibeCheck";

  // 숫자는 화면에서 가장 먼저 읽히는 부분이라 위에 둔다.
  $("stats").replaceChildren(...[
    ["파일", d.file_count],
    ["줄", d.total_lines.toLocaleString()],
    ["함수·클래스", d.symbol_count],
    ["파일 간 참조", d.internal_import_count],
  ].map(([label, value]) => {
    const box = el("div", "stat");
    box.append(el("b", null, value), el("span", null, label));
    return box;
  }));

  const deps = d.external_deps.length
    ? d.external_deps.map((x) => el("span", "tag", x))
    : [el("span", null, "서드파티 의존성이 없습니다.")];
  $("deps").replaceChildren(...deps);

  // 확정과 추정을 섞으면 읽는 사람이 확신도를 오해한다. CLI 리포트와 같은 규칙.
  const entryRow = (e) => {
    const row = el("div", "entry");
    row.append(
      el("span", e.confirmed ? "mark on" : "mark", e.confirmed ? "확정" : "추정"),
      el("code", null, e.target),
      el("span", null, " — " + e.evidence)
    );
    return row;
  };

  const confirmed = d.entry_points.filter((e) => e.confirmed);
  const guessed = d.entry_points.filter((e) => !e.confirmed);

  const entryNodes = [];
  if (!d.entry_points.length) {
    entryNodes.push(el("div", null, "진입점을 찾지 못했습니다."));
  } else {
      // 접힌 상태에서도 왜 전부 추정인지 읽혀야 한다.
    if (!confirmed.length) {
      entryNodes.push(el("div", "fnote",
        "pyproject.toml에 등록된 명령이 없습니다. 아래는 파일 이름과 코드 관례로 추정한 것입니다."));
    }
    entryNodes.push(...confirmed.map(entryRow));

    // 개수를 본다. 확정이 있으면 추정은 참고 사항이라 4개 초과에서 접고,
    // 확정이 없으면 유일한 단서이므로 8개까지는 펼쳐둔다.
    // 개수를 아예 안 보면 벽이 된다. 실행 파일이 열셋인 레포에서
    // 화면이 목록으로 가득 찼다. CLI 리포트와 같은 기준.
    if (guessed.length > (confirmed.length ? 4 : 8)) {
      const box = el("details");
      box.append(el("summary", null, "직접 실행 가능한 파일 " + guessed.length + "개"));
      box.append(...guessed.map(entryRow));
      entryNodes.push(box);
    } else {
      entryNodes.push(...guessed.map(entryRow));
    }
  }
  $("entries").replaceChildren(...entryNodes);

  const nodes = [];
  for (const [dir, items] of groupByDir(d.file_map)) {
    nodes.push(el("div", "dir", dir || "/"));
    for (const f of items) {
      const box = el("details");
      const head = el("summary");
      head.append(
        el("span", "fname", f.name),
        el("span", "fnote", oneLine(f.path, f.overview))
      );
      box.append(head, el("pre", null, detailBody(f.overview)));

      const rel = relations(f.path, d.import_edges);
      if (rel) box.append(rel);
      nodes.push(box);
    }
  }
  $("files").replaceChildren(...nodes);

  // 숫자가 이상할 때 "인덱스가 오래됐나"를 먼저 의심할 근거가 된다.
  const bits = [];
  const m = d.index_meta || {};
  if (m.indexed_at) bits.push("인덱싱 " + m.indexed_at.replace("T", " ").replace("+00:00", " UTC"));
  if (m.exclude_dirs && m.exclude_dirs.length) bits.push("제외: " + m.exclude_dirs.join(", "));
  if (!d.has_readme) bits.push("README 없음");
  if (d.stale_count) bits.push("변경되어 건너뛴 청크 " + d.stale_count + "개");
  $("meta").textContent = bits.join(" · ");

  $("result").hidden = false;
}


/**
 * 질문 하나에 딸린 답변 입력과 채점 결과 영역을 만든다.
 *
 * 채점은 LLM을 부르므로 버튼을 눌러야만 나간다. 입력 중 자동 채점 같은
 * 것을 붙이면 타이핑만으로 요금이 나간다.
 *
 * 채점 결과를 입력창 아래에 두고 입력 내용은 지우지 않는다.
 * 점수를 보고 답변을 고쳐 다시 채점하는 것이 이 화면의 사용법이고,
 * 그때마다 처음부터 다시 쓰게 하면 안 된다.
 *
 * @param {object} q - 질문 하나.
 * @param {string} repo - 대상 레포 경로.
 * @returns {HTMLElement} 입력창과 결과 영역을 담은 요소.
 */
function answerBox(q, repo) {
  const wrap = el("div", "answer");

  const input = el("textarea");
  input.placeholder = "여기에 답변을 써보세요. 코드에 근거가 있는 것과 추측을 구분해보세요.";

  const row = el("div", "row");
  const btn = el("button", null, "채점");
  const note = el("span", "note");
  row.append(btn, note);

  const result = el("div", "score");
  result.hidden = true;

  wrap.append(input, row, result);

  btn.addEventListener("click", async () => {
    const body = input.value.trim();
    if (!body) {
      note.textContent = "답변을 먼저 작성하세요.";
      return;
    }

    btn.disabled = true;
    note.textContent = "채점하는 중...";
    result.hidden = true;

    try {
      const res = await fetch(
        "/api/practice?path=" + encodeURIComponent(repo),
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q.text, answer: body }),
        }
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "채점 실패 (" + res.status + ")");

      renderScore(result, data);
      result.hidden = false;
      note.textContent = "";
    } catch (err) {
      note.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  return wrap;
}


/**
 * 면접 질문을 단계별로 그린다.
 *
 * 번호와 단계 순서는 서버가 정한 것을 그대로 쓴다. 프론트에서 다시 매기면
 * CLI의 `whyd practice --question-no`와 어긋나 같은 번호가 다른 질문을
 * 가리키게 된다.
 *
 * 답은 보여주지 않는다. 답을 함께 두면 읽고 넘어가게 되는데,
 * 이 화면의 목적은 사용자가 스스로 답해보다 막히는 지점을 만나는 것이다.
 *
 * @param {object} d - /api/interview 응답.
 * @param {string} repo - 사용자가 입력한 경로. 안내 명령줄에 그대로 넣는다.
 */
function renderInterview(d, repo) {
  if (!d.total) {
    $("questions").replaceChildren(el("div", null, "만들 수 있는 질문이 없습니다."));
    return;
  }

  const nodes = [];

  // 아래 목록을 답으로 오해하면 읽고 넘어가게 된다.
  // 먼저 스스로 답해보다 막히는 지점을 만나는 것이 이 화면의 목적이다.
  nodes.push(el("div", "qguide", "먼저 스스로 답해보세요. 아래 목록은 답이 아니라 답의 재료입니다."));

  for (const group of d.stages) {
    nodes.push(el("h2", "stage", group.stage));

    for (const q of group.questions) {
      const box = el("div", "qbox");

      const head = el("div", "qhead");
      head.append(el("span", "qno", "Q" + q.no), el("span", "qtext", q.text));
      box.append(head);

      // 코드로 답할 수 있는지가 이 화면에서 가장 중요한 구분이다.
      // 답할 수 없는 질문은 준비하는 방식 자체가 달라진다.
      box.append(
        q.answerable
          ? el("div", "qflag safe", "코드로 답할 수 있는 질문입니다.")
          : el("div", "qflag warn", "코드에 근거가 없는 부분이 있습니다.")
      );

      if (q.can_say.length || q.risky.length) {
        const list = el("dl", "qlist");
        if (q.can_say.length) {
          list.append(el("dt", null, "코드로 뒷받침되는 사실"));
          list.append(...q.can_say.map((t) => el("dd", null, t)));
        }
        if (q.risky.length) {
          list.append(el("dt", null, "근거 없이 말하면 무너지는 것"));
          list.append(...q.risky.map((t) => el("dd", null, t)));
        }
        box.append(list);
      }

      box.append(answerBox(q, repo));

      nodes.push(box);
    }
  }

  $("questions").replaceChildren(...nodes);
}


const VERDICT_LABEL = {
  confirmed: ["확인됨", "ok"],
  contradicted: ["모순됨", "bad"],
  unverifiable: ["확인불가", "unk"],
};

/**
 * 채점 결과를 그린다.
 *
 * 근거 없이 단정한 지점을 주장 목록보다 위에 둔다. 목록 안에 섞어두면
 * 지나치는데, 면접에서 무너지는 곳이 정확히 거기다.
 *
 * 같은 '확인불가'라도 유보한 것은 초록으로 표시한다. 코드에 근거가 없다는
 * 것을 알고 그렇게 말한 것은 감점 사유가 아니다. verdict와 hedged를
 * 나눠 저장한 이유가 화면에서 드러나는 지점이다.
 *
 * @param {HTMLElement} box - 결과를 담을 요소.
 * @param {object} d - /api/practice 응답.
 */
function renderScore(box, d) {
  const nodes = [];

  const nums = el("div", "nums");
  for (const [label, value] of [
    ["구체성", d.specificity],
    ["판단보정", d.calibration],
    ["근거밀착", d.groundedness],
  ]) {
    const axis = el("span", "axis");
    axis.append(label + " ", el("b", null, value));
    nums.append(axis);
  }
  nums.append(el("span", "sum", d.total + "/6"));
  nodes.push(nums);

  if (d.risky_count) {
    nodes.push(el("div", "alarm", "근거 없이 단정한 지점 " + d.risky_count + "개"));
  }

  for (const c of d.claims) {
    const row = el("div", "claim");
    let [label, cls] = VERDICT_LABEL[c.verdict] || ["확인불가", "unk"];

    // 확인불가여도 유보했으면 문제가 아니다.
    if (c.verdict === "unverifiable" && c.hedged) {
      label = "확인불가(유보)";
      cls = "ok";
    }

    const line = el("div", "tagline");
    line.append(el("span", "verdict " + cls, label), el("span", null, c.claim));
    row.append(line);

    if (c.evidence) row.append(el("div", "why", c.evidence));
    else if (c.note) row.append(el("div", "why", c.note));

    nodes.push(row);
  }

  if (d.verdict_line) nodes.push(el("div", "line", d.verdict_line));
  if (d.revision) nodes.push(el("div", "fix", "다시 쓴다면: " + d.revision));

  box.replaceChildren(...nodes);
}


/**
 * 간선을 폴더 단위로 접는다.
 *
 * 폴더로 접으면 계층이 드러나고, 개별 파일 관계는 따로 볼 수 있다.
 *
 * 같은 폴더 안의 참조는 버린다. 폴더 자기 자신으로 도는 화살표는
 * 관계도에서 정보가 아니다.
 *
 * @param {Array<{from: string, to: string}>} edges - 파일 단위 간선.
 * @returns {Array<[string, string, number]>} [출발 폴더, 도착 폴더, 간선 수].
 */
function foldEdges(edges) {
  const dirOf = (p) => {
    const cut = p.lastIndexOf("/");
    return cut === -1 ? "/" : p.slice(0, cut);
  };

  const counted = new Map();
  for (const e of edges) {
    const a = dirOf(e.from);
    const b = dirOf(e.to);
    if (a === b) continue;
    const key = a + "\u0000" + b;
    counted.set(key, (counted.get(key) || 0) + 1);
  }

  return [...counted.entries()]
    .map(([key, n]) => [...key.split("\u0000"), n])
    .sort((x, y) => y[2] - x[2]);
}

/**
 * 폴더 단위 관계도를 그린다.
 *
 * Mermaid는 노드 id에 슬래시나 점을 넣을 수 없어 번호로 바꾸고
 * 표시 이름만 원래 경로로 둔다.
 *
 * @param {object} d - /api/overview 응답.
 */
async function renderGraph(d) {
  const box = $("graph");
  const folded = foldEdges(d.import_edges || []);

  if (!folded.length) {
    box.replaceChildren(el("div", "empty", "파일 간 참조가 없습니다."));
    return;
  }

  const ids = new Map();
  const idOf = (name) => {
    if (!ids.has(name)) ids.set(name, "n" + ids.size);
    return ids.get(name);
  };

  const lines = ["graph LR"];
  for (const [a, b, n] of folded) {
    const label = n > 1 ? "|" + n + "|" : "";
    lines.push(`  ${idOf(a)}["${a}"] -->${label} ${idOf(b)}["${b}"]`);
  }

  try {
    const { svg } = await window.mermaid.render("dep", lines.join("\n"));
    box.className = "graph";
    box.innerHTML = svg;
  } catch (err) {
    box.replaceChildren(el("div", "empty", "관계도를 그리지 못했습니다: " + err.message));
  }
}

</script>
</body>
